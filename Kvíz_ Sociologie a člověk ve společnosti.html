[5,"Příklady sociální normy:","pozdravit při příchodu, nevyrušovat při výuce, respektovat pořadí ve frontě","mít nejlepší známky, nosit červenou, jíst o víkendu","mít vysoký plat, nosit uniformu, jezdit na kole","platit daně, volit, vlastnit auto"],
[5,"Funkce sociální normy:","umožňuje předvídat chování, usnadňuje soužití a podporuje společenský řád","trestá všechny deviantní","měří statisticky chování","vytváří třídní rozdíly"],
[5,"Že ženy nosily kalhoty bylo v 19. stol. deviací. Deviace tedy závisí na…","době","místě","kultuře","zákonech"],
[5,"Chování, které je v parku v pořádku, ale v kostele ne, ukazuje, že deviace závisí na…","místě","době","věku","zákonech"],
[5,"Přirozená deviace je např…","mezigenerační rozdíly","trestný čin","porušení zákona","ohrožení společnosti"],
[5,"Sociálně patologický jev je…","deviantní chování, které představuje hrozbu pro společnost","mezigenerační rozdíl","jakákoli odlišnost","konformní chování"]
];
const $=id=>document.getElementById(id);
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let cur=[],order=[],i=0,score=0,wrong=[],all=true;
function start(list){cur=list;order=sh(list.slice());i=0;score=0;wrong=[];show()}
function show(){
 if(i>=order.length)return end();
 const q=order[i],c=C[q[0]][1],o=sh([q[2],q[3],q[4],q[5]]);
 $("sub").textContent="Otázka "+(i+1)+" z "+order.length+" · ⭐ "+score;
 $("app").innerHTML='<button class="bk" id="bk">← Zpět na témata</button><div class="bar"><i style="width:'+(i/order.length*100)+'%"></i></div><div class="card" style="--c:'+c+'"><div class="tag">'+C[q[0]][2]+' '+C[q[0]][0]+'</div><div class="q">'+q[1]+'</div><div class="opts" id="o"></div></div>';
 $("bk").onclick=menu;
 o.forEach((t,k)=>{const b=document.createElement("button");b.dataset.t=t;b.innerHTML='<span class="L">'+"ABCD"[k]+'</span><span></span>';b.lastChild.textContent=t;b.onclick=()=>pick(b,t,q,c);$("o").appendChild(b)});
}
function pick(b,t,q,c){
 const bs=[...$("o").children];bs.forEach(x=>{x.disabled=true;if(x.dataset.t===q[2])x.classList.add("ok")});
 const R=a=>a[Math.floor(Math.random()*a.length)];let m;
 if(t===q[2]){score++;m=R(["Správně! 🎉","Skvělé, tohle umíš! ⭐","Právě tak! 🌸","Jde ti to! 💪","Boom, trefa! 🎯"])}else{b.classList.add("no");wrong.push(q);m=R(["Ups, skoro! 🙈 Správná je ta zelená.","Nevadí, příště to vyjde! 🌈","Tuhle si zapamatuj! 📌","Chyba je učitel, jde se dál! 😉"])}
 const d=document.createElement("div");d.className="msg";d.textContent=m;$("o").appendChild(d);
 const n=document.createElement("button");n.className="next";n.style.setProperty("--c",c);
 n.textContent=i+1<order.length?"Další otázka":"Zobrazit výsledek";n.onclick=()=>{i++;show();window.scrollTo(0,0)};
 $("o").appendChild(n);n.focus();
}
function end(){
 const p=Math.round(score/order.length*100),e=p>=90?"🏆":p>=70?"🎉":p>=50?"💪":"📚";
 $("sub").textContent="Hotovo";
 let h='<div class="bar"><i style="width:100%"></i></div><div class="res"><div class="big">'+e+'</div><h2 style="text-align:center;margin:0">'+score+' / '+order.length+' ('+p+' %)</h2>';
 if(wrong.length){h+='<p>Tyhle si ještě projdi 👇</p><ul>'+wrong.map(q=>'<li><span style="color:'+C[q[0]][1]+'">●</span> '+q[1]+'<br><b>'+q[2]+'</b></li>').join("")+'</ul>'}
 else h+='<p style="text-align:center">Bez chyby, všechno umíš! 🥳</p>';
 h+='</div><div class="row">'+(wrong.length?'<button id="r1" style="--c:#a84d73">🔁 Zkusit znovu jen chybné</button>':'')+'<button id="r2" style="--c:#a84d73">🔄 Zopakovat celé téma</button><button id="r3" style="--c:#a84d73">🏠 Zpět na témata</button></div>';
 $("app").innerHTML=h;
 if($("r1"))$("r1").onclick=()=>start(wrong);
 $("r2").onclick=()=>start(cur);$("r3").onclick=menu;
}
function menu(){
 $("sub").textContent="Vyber si téma a jdeme na to! 🚀";
 $("app").innerHTML='<div class="row">'+C.map((c,k)=>'<button class="tp" data-k="'+k+'" style="--c:'+c[1]+'"><span class="em">'+c[2]+'</span><b>'+c[0]+'</b><br><small>'+Q.filter(q=>q[0]==k).length+' otázek</small></button>').join("")+'</div><div class="row"><button id="s" style="--c:#a84d73">🎲 Vše dohromady ('+Q.length+' otázek)</button></div>';
 $("s").onclick=()=>start(Q);
 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>start(Q.filter(q=>q[0]==b.dataset.k)));
}
menu();
</script></body></html>
